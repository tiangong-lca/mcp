name: ai-doc-lint

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref for the manual docpact comparison.
        required: false
        default: origin/main

permissions:
  contents: read

jobs:
  ai-doc-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch branches
        run: git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cached docpact 0.1.9 binary
        id: docpact-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/docpact
          key: docpact-bin-${{ runner.os }}-${{ runner.arch }}-0.1.9

      - name: Install docpact
        run: |
          if [ -x "$HOME/.cargo/bin/docpact" ] && [ "$("$HOME/.cargo/bin/docpact" --version)" = "docpact 0.1.9" ]; then
            echo "Using cached docpact 0.1.9"
          else
            cargo install docpact --version 0.1.9 --locked --force
          fi

      - name: Run local docpact gate
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: scripts/docpact-gate.sh --base "$BASE_REF"
